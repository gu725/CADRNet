[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cadrnet"
version = "0.1.0"
description = "Clean CADRNet implementation with CDAM, GDCR, and feature exchange strategies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "timm",
]

[tool.setuptools.packages.find]
include = ["cadrnet*"]
